<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <div class="form-box">
        <h2>Registration Form</h2>
        <p>Create an account</p>

        <form onsubmit="return data()" action="royals.html">
            <label for="username">Username</label><br>
            <input type="text" id="username" placeholder="Enter username"><br><br>

            <label for="email">Email</label><br>
            <input type="email" id="email" placeholder="Enter user email"><br><br>

            <label for="password">Password</label><br>
            <input type="password" id="password" placeholder="Enter user password"><br><br>

            <label for="confirm-password">Confirm Password</label><br>
            <input type="password" id="confirm-password" placeholder="Re-enter user password"><br><br>

            <button type="submit">Submit</button>
        </form>
    </div>

    <script>
        function data() {
            const a = document.getElementById("username").value.trim();
            const b = document.getElementById("email").value.trim();
            const c = document.getElementById("password").value;
            const d = document.getElementById("confirm-password").value;
            
            const emailpattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (a === "" || b === "" || c === "" || d === "") {
                alert("All fields are required");
                return false;
            } 
            else if (a.length < 6) {
                alert("Username should contain at least 6 characters");
                return false;
            }else if(!emailpattern.test(b)){
                alert("Email is invalid");
                return false;

            }
            else if (c.length < 8) {
                alert("password should contain at least 6 characters");
                return false;
            }
            else if(c !== d){
                alert("Password does not match")
                return false
            }
            return true;
        }
    </script>

</body>
</html>
